    <animate attributeName="x" values="620; 825; 825; 620; 620" keyTimes="0; 0.3; 0.8; 0.9; 1" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0;1;0" dur="1s" repeatCount="indefinite" />
  </rect>

