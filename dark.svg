<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Glows -->
    <radialGradient id="bgGlow1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    
    <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#7C3AED;#22D3EE" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#7C3AED" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Animated Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="200%" y2="200%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.05)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.3)">
         <animate attributeName="stop-color" values="rgba(255,255,255,0.05); rgba(255,255,255,0.4); rgba(255,255,255,0.05)" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>

    <!-- Clip Paths -->
    <clipPath id="leftPanelClip"><rect x="30" y="30" width="430" height="550" rx="16" /></clipPath>
    <clipPath id="typing">
      <rect x="620" y="140" width="0" height="30">
         <animate attributeName="width" values="0; 260; 260; 0; 0" keyTimes="0; 0.3; 0.8; 0.9; 1" dur="6s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .font-sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
    .pill { transition: all 0.3s ease; transform-origin: center; cursor: pointer; }
    .pill:hover { transform: scale(1.05); filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.6)); }
    .icon { fill: #94A3B8; transition: all 0.3s ease; }
    .icon:hover { fill: #22D3EE; }
  </style>

  <!-- Background -->
  <rect width="1180" height="610" rx="20" fill="#030712" />
  <circle cx="200" cy="200" r="400" fill="url(#bgGlow1)" />
  <circle cx="980" cy="410" r="400" fill="url(#bgGlow2)" />

  <!-- Floating Particles -->
  <g fill="#22D3EE" opacity="0.3">
    <circle cx="100" cy="500" r="2"><animateTransform attributeName="transform" type="translate" values="0,0; 0,-20; 0,0" dur="4s" repeatCount="indefinite" /></circle>
    <circle cx="1100" cy="100" r="3"><animateTransform attributeName="transform" type="translate" values="0,0; 0,-30; 0,0" dur="5s" repeatCount="indefinite" /></circle>
    <circle cx="500" cy="550" r="1.5"><animateTransform attributeName="transform" type="translate" values="0,0; 0,-15; 0,0" dur="3.5s" repeatCount="indefinite" /></circle>
  </g>

  <!-- LEFT PANEL (ASCII) -->
  <rect x="30" y="30" width="430" height="550" rx="16" fill="#0F172A" stroke="url(#borderGrad)" stroke-width="1.5" />
  
  <g clip-path="url(#leftPanelClip)">
    <!-- Floating ASCII Container -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="5s" repeatCount="indefinite" />
      <text x="75" y="110" class="font-mono" font-size="14" font-weight="bold" fill="url(#asciiGrad)">
        <tspan x="75" dy="0" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.1s" dur="0.2s" fill="freeze"/>           ..::----::..           </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.2s" dur="0.2s" fill="freeze"/>        .:=**##%%%%##**=:.        </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.2s" fill="freeze"/>      .-*#%@@@@@@@@@@@@%#*-.      </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.4s" dur="0.2s" fill="freeze"/>     :=#@@@@@@@@@@@@@@@@@@#=:     </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.2s" fill="freeze"/>    .-#@@@@@@@@@@@@@@@@@@@@#-.    </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.6s" dur="0.2s" fill="freeze"/>    :*@@@@@@@@@@@@@@@@@@@@@@*:    </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.7s" dur="0.2s" fill="freeze"/>    -%@@@@@@@@@@@@@@@@@@@@@@%-    </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.8s" dur="0.2s" fill="freeze"/>    +@@@@@@@@@@@@@@@@@@@@@@@@+    </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.2s" fill="freeze"/>    *@@@@@@@@@@@@@@@@@@@@@@@@*    </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.0s" dur="0.2s" fill="freeze"/>    #@@@@@@@@@@@@@@@@@@@@@@@@#    </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.1s" dur="0.2s" fill="freeze"/>    %@@@@%**#%@@@@@@%#**%@@@@%    </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.2s" dur="0.2s" fill="freeze"/>    %@@@@+  ..=*@@*=..  +@@@@%    </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.3s" dur="0.2s" fill="freeze"/>    #@@@@*. ** -@@- ** .*@@@@#    </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.4s" dur="0.2s" fill="freeze"/>    *@@@@@*...:%@@%:...+@@@@@*    </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.5s" dur="0.2s" fill="freeze"/>    +@@@@@@%##@@@@@@##%@@@@@@+    </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.6s" dur="0.2s" fill="freeze"/>    -%@@@@@@@@@@@@@@@@@@@@@@%-    </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.7s" dur="0.2s" fill="freeze"/>    :*@@@@@@@%#++++#%@@@@@@@*:    </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.8s" dur="0.2s" fill="freeze"/>    .-#@@@@%*=+****+=*%@@@@#-.    </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.9s" dur="0.2s" fill="freeze"/>     :=#@@@@@#*====*#@@@@@#=:     </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.0s" dur="0.2s" fill="freeze"/>      .-*#%@@@@@@@@@@@@%#*-.      </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.1s" dur="0.2s" fill="freeze"/>        .:=**##%%%%##**=:.        </tspan>
        <tspan x="75" dy="16" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.2s" dur="0.2s" fill="freeze"/>           ..::----::..           </tspan>
      </text>
    </g>
    <!-- Scanline Sweep -->
    <rect x="30" y="30" width="430" height="3" fill="url(#accentGrad)" opacity="0.6">
      <animate attributeName="y" values="30; 580; 30" dur="7s" repeatCount="indefinite" />
    </rect>
    <!-- Glass Reflection -->
    <polygon points="30,30 150,30 30,250" fill="#ffffff" opacity="0.03" />
  </g>

  <!-- RIGHT PANEL (Terminal) -->
  <rect x="490" y="30" width="660" height="550" rx="16" fill="#0F172A" stroke="url(#borderGrad)" stroke-width="1.5" />
  
