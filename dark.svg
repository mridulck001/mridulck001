    <g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.8s" dur="0.4s" fill="freeze" /><text x="520" y="210" fill="#94A3B8">{</text></g>
    
    <g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.1s" dur="0.4s" fill="freeze" />
      <text x="540" y="240" fill="#22D3EE">"Location"</text><text x="630" y="240" fill="#94A3B8">:</text><text x="650" y="240" fill="#F8FAFC">"Palampur, Himachal Pradesh",</text>
    </g>
    
    <g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.4s" dur="0.4s" fill="freeze" />
      <text x="540" y="270" fill="#22D3EE">"Education"</text><text x="630" y="270" fill="#94A3B8">:</text><text x="650" y="270" fill="#F8FAFC">"B.Tech CSE",</text>
    </g>
    
    <g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.7s" dur="0.4s" fill="freeze" />
      <text x="540" y="300" fill="#22D3EE">"Focus"</text><text x="630" y="300" fill="#94A3B8">:</text><text x="650" y="300" fill="#F8FAFC">"End-to-end scalable ML solutions",</text>
    </g>
    
    <g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.0s" dur="0.4s" fill="freeze" />
      <text x="540" y="330" fill="#22D3EE">"Portfolio"</text><text x="630" y="330" fill="#94A3B8">:</text><text x="650" y="330" fill="#10B981">"mridulck001.github.io",</text>
    </g>
    
    <g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.3s" dur="0.4s" fill="freeze" />
      <text x="540" y="360" fill="#22D3EE">"Email"</text><text x="630" y="360" fill="#94A3B8">:</text><text x="650" y="360" fill="#F8FAFC">"mridulku225@gmail.com"</text>
    </g>

    <g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.6s" dur="0.4s" fill="freeze" /><text x="520" y="390" fill="#94A3B8">}</text></g>
  </g>

  <!-- Glowing Skills Pills -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="3.0s" dur="0.6s" fill="freeze" />
    <text x="520" y="440" class="font-mono" font-size="14" fill="#94A3B8">> skills.load()</text>
    
    <!-- Row 1 -->
    <g class="pill" transform="translate(520, 460)">
      <rect width="75" height="28" rx="14" fill="rgba(34, 211, 238, 0.05)" stroke="#7C3AED" stroke-width="1.2"/>
      <text x="37.5" y="19" class="font-sans" font-size="13" font-weight="500" fill="#F8FAFC" text-anchor="middle">Python</text>
    </g>
    <g class="pill" transform="translate(605, 460)">
      <rect width="105" height="28" rx="14" fill="rgba(34, 211, 238, 0.05)" stroke="#22D3EE" stroke-width="1.2"/>
      <text x="52.5" y="19" class="font-sans" font-size="13" font-weight="500" fill="#F8FAFC" text-anchor="middle">TensorFlow</text>
    </g>
    <g class="pill" transform="translate(720, 460)">
      <rect width="115" height="28" rx="14" fill="rgba(34, 211, 238, 0.05)" stroke="#10B981" stroke-width="1.2"/>
      <text x="57.5" y="19" class="font-sans" font-size="13" font-weight="500" fill="#F8FAFC" text-anchor="middle">HuggingFace</text>
    </g>
    <g class="pill" transform="translate(845, 460)">
      <rect width="95" height="28" rx="14" fill="rgba(34, 211, 238, 0.05)" stroke="#7C3AED" stroke-width="1.2"/>
      <text x="47.5" y="19" class="font-sans" font-size="13" font-weight="500" fill="#F8FAFC" text-anchor="middle">LangChain</text>
    </g>

    <!-- Row 2 -->
    <g class="pill" transform="translate(520, 500)">
      <rect width="70" height="28" rx="14" fill="rgba(34, 211, 238, 0.05)" stroke="#10B981" stroke-width="1.2"/>
      <text x="35" y="19" class="font-sans" font-size="13" font-weight="500" fill="#F8FAFC" text-anchor="middle">React</text>
    </g>
    <g class="pill" transform="translate(600, 500)">
      <rect width="80" height="28" rx="14" fill="rgba(34, 211, 238, 0.05)" stroke="#7C3AED" stroke-width="1.2"/>
      <text x="40" y="19" class="font-sans" font-size="13" font-weight="500" fill="#F8FAFC" text-anchor="middle">FastAPI</text>
    </g>
    <g class="pill" transform="translate(690, 500)">
      <rect width="85" height="28" rx="14" fill="rgba(34, 211, 238, 0.05)" stroke="#22D3EE" stroke-width="1.2"/>
      <text x="42.5" y="19" class="font-sans" font-size="13" font-weight="500" fill="#F8FAFC" text-anchor="middle">MongoDB</text>
    </g>
  </g>

  <!-- Social Icons -->
  <g opacity="0" transform="translate(0, 10)">
    <animate attributeName="opacity" values="0;1" begin="3.4s" dur="0.6s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" values="0,10; 0,0" begin="3.4s" dur="0.6s" fill="freeze" />
    
    <!-- GitHub -->
