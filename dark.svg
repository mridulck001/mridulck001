  <circle cx="535" cy="50" r="6" fill="#F59E0B" />
  <circle cx="555" cy="50" r="6" fill="#10B981" />
  <text x="820" y="54" class="font-sans" font-size="13" fill="#94A3B8" text-anchor="middle">mridul@macbook-pro:~</text>
  <line x1="490" y1="70" x2="1150" y2="70" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Terminal Content -->
  <text x="520" y="115" class="font-mono" font-size="28" font-weight="bold" fill="#F8FAFC">
    > Hi 👋 I'm Mridul
  </text>

  <!-- Animated Typing Text -->
  <text x="520" y="160" class="font-mono" font-size="20" fill="#94A3B8">> I'm a</text>
  <g clip-path="url(#typing)">
    <text x="620" y="161" class="font-mono" font-size="20" font-weight="bold" fill="url(#accentGrad)">AI &amp; ML Engineer</text>
  </g>
  <!-- Blinking Cursor -->
